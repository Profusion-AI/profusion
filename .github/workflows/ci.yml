name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      COLUMNS: "120"
      LINES: "80"
      TERM: xterm-256color
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run backend tests
        run: uv run pytest -q

      - name: Run offline smoke
        run: uv run profusion smoke --offline

      - name: Run Path C receipt smoke
        run: scripts/path_c_smoke.sh
