[project]
name = "profusion"
version = "0.1.0"
description = "B2B workflow-trust and evidence-receipt system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sqlite-utils>=3.36",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
profusion = "orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
