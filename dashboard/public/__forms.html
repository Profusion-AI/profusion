<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Profusion AI Forms</title>
  </head>
  <body>
    <form name="trust-session" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="trust-session" />
      <input type="hidden" name="subject" value="Profusion AI trust strategy session request" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="org" />
      <input type="email" name="email" />
      <textarea name="context"></textarea>
    </form>
  </body>
</html>
